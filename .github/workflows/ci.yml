name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('src-tauri/Cargo.lock') }}

      # TEMPORARY: regenerates Cargo.lock for a newly added dependency and
      # hands it back, because this project is developed on a machine with no
      # cargo. Reverted in the next commit, together with --locked below.
      - name: Refresh lockfile
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: src-tauri/Cargo.lock

      - name: Test
        working-directory: src-tauri
        run: cargo test --locked
