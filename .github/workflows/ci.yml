name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Stub the rank sidecar
        working-directory: src-tauri
        shell: pwsh
        run: |
          # generate_context! only checks that the resource path exists; the
          # sidecar is never executed by clippy or the tests (parse_sidecar_output
          # is pure). The real exe is built by the release workflow, so an empty
          # placeholder is all these jobs need.
          New-Item -ItemType File -Force -Path binaries/cs2-rank-sidecar.exe | Out-Null

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test --locked
